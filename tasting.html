<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasting Menu — Staff Reference</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0c0a; --bg2: #161310; --bg3: #1e1a16; --card: #1a1612;
    --gold: #c9a96e; --gold2: #e8c98a; --gold-dim: #8a6e42;
    --cream: #f0e8d8; --muted: #8a7e6e; --border: rgba(201,169,110,0.15);
    --border2: rgba(201,169,110,0.3);
    --red: #c94a4a; --red-dim: rgba(201,74,74,0.12);
    --green: #5a9a6a; --green-dim: rgba(90,154,106,0.12);
    --yellow: #c9a020; --yellow-dim: rgba(201,160,32,0.12);
  }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--cream); font-family: 'Outfit', sans-serif; font-weight: 300; min-height: 100vh; -webkit-font-smoothing: antialiased; }

  /* ── HEADER ── */
  .site-header { padding: 3rem 1.5rem 2rem; text-align: center; border-bottom: 1px solid var(--border); position: relative; overflow: hidden; }
  .site-header::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 0%, rgba(139,100,32,0.06) 0%, transparent 70%); pointer-events: none; }
  .header-eyebrow { font-size: 15px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold-dim); margin-bottom: 0.75rem; }
  .header-theme { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.4rem, 11vw, 3.8rem); font-weight: 300; color: var(--cream); line-height: 1; letter-spacing: 0.02em; margin-bottom: 0.3rem; }
  .header-title { font-family: 'Cormorant Garamond', serif; font-size: 1rem; color: var(--gold-dim); font-style: italic; margin-bottom: 0.5rem; }
  .header-meta { font-size: 13px; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 0.75rem; }
  .header-pricing { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; padding: 5px 16px; border-radius: 20px; background: rgba(201,169,110,0.08); border: 1px solid var(--border2); color: var(--gold); letter-spacing: 0.04em; margin-bottom: 0.25rem; }
  .header-pricing span { color: var(--gold-dim); }
  .header-nav { margin-top: 1.25rem; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .header-nav a { font-size: 13px; padding: 4px 14px; border-radius: 20px; border: 1px solid rgba(201,169,110,0.3); color: var(--gold-dim); text-decoration: none; transition: all 0.15s; }
  .header-nav a:hover { border-color: var(--gold-dim); color: var(--gold); }

  /* ── INTRO ── */
  .intro-block { margin: 1.25rem 1rem 0; padding: 14px 16px; background: rgba(201,169,110,0.05); border: 1px solid var(--border); border-radius: 10px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1rem; color: var(--muted); line-height: 1.7; }

  /* ── CONTROLS ── */
  .controls { padding: 0.75rem 1.25rem 0.5rem; position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--border); }
  [id^='card-'] { scroll-margin-top: 360px; }
  .search-wrap { position: relative; margin-bottom: 0.5rem; }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gold-dim); font-size: 13px; pointer-events: none; }
  #search { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px 10px 38px; color: var(--cream); font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 300; outline: none; transition: border-color 0.2s; }
  #search::placeholder { color: var(--muted); }
  #search:focus { border-color: var(--gold-dim); }

  /* ── COURSE RAIL ── */
  .course-rail { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; margin-bottom: 0.5rem; }
  .course-rail::-webkit-scrollbar { display: none; }
  .rail-btn { position: relative; flex-shrink: 0; display: flex; align-items: baseline; gap: 6px; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: 'Outfit', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
  .rail-btn:hover { border-color: var(--border2); color: var(--gold-dim); }
  .rail-btn.active { background: rgba(201,169,110,0.12); border-color: var(--gold-dim); color: var(--gold); }
  .rail-num { font-family: 'Cormorant Garamond', serif; font-size: 15px; color: var(--gold-dim); letter-spacing: 0.04em; }
  .rail-btn.active .rail-num { color: var(--gold2); }
  .rail-label { text-transform: capitalize; letter-spacing: 0.04em; }
  .rail-btn.flagged::after { content: ''; position: absolute; top: -3px; right: -3px; width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--bg); }
  .rail-btn.flagged.contains::after { background: var(--red); }
  .rail-btn.flagged.check::after { background: var(--yellow); }

  /* Collapsed controls */
  .controls.collapsed .course-rail { display: none; }
  .expand-filters-btn { display: none; font-size: 13px; color: var(--gold-dim); background: none; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; padding: 0 4px; }
  .controls.collapsed .expand-filters-btn { display: inline-block; }

  /* ── MENU PANELS (verdict + flight) ── */
  .panel-stack { padding: 0.75rem 1rem 0; display: flex; flex-direction: column; gap: 8px; }
  .panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .panel-title { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold-dim); }
  .panel-sub { font-family: 'Cormorant Garamond', serif; font-size: 15px; font-style: italic; color: var(--muted); margin-top: 2px; }
  .panel-arrow { color: var(--gold-dim); font-size: 13px; flex-shrink: 0; }
  .panel-body { display: none; padding: 0 14px 14px; }
  .panel.open .panel-body { display: block; }

  /* Verdict grid */
  .verdict-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .verdict-item { padding: 8px 10px; border-radius: 8px; font-size: 13px; text-align: left; cursor: pointer; font-family: 'Outfit', sans-serif; font-weight: 300; -webkit-tap-highlight-color: transparent; transition: border-color 0.15s; }
  .verdict-item.clear { background: var(--green-dim); border: 1px solid rgba(90,154,106,0.2); }
  .verdict-item.check { background: var(--yellow-dim); border: 1px solid rgba(201,160,32,0.2); }
  .verdict-item.blocked { background: var(--red-dim); border: 1px solid rgba(201,74,74,0.2); }
  .verdict-item.focused { border-width: 1px; border-color: var(--gold); }
  .verdict-name { font-weight: 500; margin-bottom: 2px; }
  .verdict-item.clear .verdict-name { color: var(--green); }
  .verdict-item.check .verdict-name { color: var(--yellow); }
  .verdict-item.blocked .verdict-name { color: var(--red); }
  .verdict-line { font-size: 12px; color: var(--muted); line-height: 1.35; }
  .verdict-hint { font-size: 12px; color: var(--muted); font-style: italic; font-family: 'Cormorant Garamond', serif; padding-top: 10px; line-height: 1.5; }

  /* Focus bar */
  .focus-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0.6rem 1rem 0; padding: 9px 12px; border-radius: 8px; background: rgba(201,169,110,0.07); border: 1px solid var(--border2); font-size: 13px; color: var(--cream); }
  .focus-bar strong { font-weight: 500; color: var(--gold); }
  .focus-bar button { margin-left: auto; background: none; border: none; color: var(--gold-dim); cursor: pointer; font-size: 13px; font-family: 'Outfit', sans-serif; text-decoration: underline; text-underline-offset: 2px; padding: 0 2px; }

  /* Flight list */
  .flight-item { display: flex; gap: 12px; padding: 11px 0; border-top: 1px solid var(--border); }
  .flight-item:first-child { border-top: none; padding-top: 2px; }
  .flight-num { font-family: 'Cormorant Garamond', serif; font-size: 15px; color: var(--gold-dim); flex-shrink: 0; width: 20px; letter-spacing: 0.04em; }
  .flight-main { flex: 1; min-width: 0; }
  .flight-producer { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-style: italic; color: var(--gold2); line-height: 1.2; }
  .flight-wine { font-size: 13px; color: var(--cream); line-height: 1.35; margin-top: 2px; }
  .flight-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .flight-tag { display: inline-block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold-dim); border: 1px solid var(--border); border-radius: 10px; padding: 1px 8px; margin-top: 5px; }
  .flight-link { display: flex; align-items: center; gap: 4px; text-decoration: none; flex-shrink: 0; align-self: flex-start; }
  .flight-bin { font-family: 'Cormorant Garamond', serif; font-size: 19px; color: var(--gold); line-height: 1; }
  .flight-arrow { font-size: 12px; color: var(--gold-dim); }
  .flight-none { font-family: 'Cormorant Garamond', serif; font-size: 19px; color: var(--gold-dim); line-height: 1; align-self: flex-start; }

  /* ── RESULT COUNT ── */
  .result-count { font-size: 13px; color: var(--muted); padding: 0.6rem 1.25rem 0; font-style: italic; font-family: 'Cormorant Garamond', serif; }

  /* ── COURSE LIST ── */
  .course-list { padding: 0.75rem 1rem 5rem; display: flex; flex-direction: column; gap: 8px; }
  .empty { text-align: center; padding: 4rem 2rem; font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-style: italic; color: var(--gold-dim); }

  /* ── COURSE CARD ── */
  .course-card { border: 1px solid var(--border); border-radius: 10px; background: var(--card); overflow: hidden; cursor: pointer; transition: border-color 0.2s; }
  .course-card:hover { border-color: var(--border2); }
  .course-card.open { border-color: var(--gold-dim); }
  .course-card.filtered-out { display: none; }
  .card-top { display: flex; align-items: flex-start; padding: 14px 16px; gap: 12px; }
  .course-num { font-family: 'Cormorant Garamond', serif; font-size: 13px; color: var(--gold-dim); flex-shrink: 0; margin-top: 5px; letter-spacing: 0.06em; }
  .card-main { flex: 1; min-width: 0; }
  .course-section-label { font-family: 'Cormorant Garamond', serif; font-size: 13px; font-style: italic; color: var(--gold-dim); letter-spacing: 0.1em; margin-bottom: 1px; }
  .course-name { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 400; color: var(--cream); line-height: 1.2; }
  .course-desc { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .card-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 7px; }
  .veg-badge { font-size: 13px; padding: 2px 8px; border-radius: 10px; background: var(--green-dim); border: 1px solid rgba(90,154,106,0.3); color: var(--green); }
  .no-pairing-badge { font-size: 13px; padding: 2px 8px; border-radius: 10px; background: rgba(201,169,110,0.06); border: 1px solid var(--border); color: var(--gold-dim); }
  .focus-badge { font-size: 13px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
  .focus-badge.safe { background: var(--green-dim); border: 1px solid rgba(90,154,106,0.3); color: var(--green); }
  .focus-badge.check { background: var(--yellow-dim); border: 1px solid rgba(201,160,32,0.3); color: var(--yellow); }
  .focus-badge.contains { background: var(--red-dim); border: 1px solid rgba(201,74,74,0.3); color: var(--red); }
  .course-card.dimmed { opacity: 0.5; }
  .course-card.flagged { border-color: rgba(201,74,74,0.4); }
  .chevron { color: var(--gold-dim); font-size: 13px; margin-top: 5px; flex-shrink: 0; transition: transform 0.25s; }
  .course-card.open .chevron { transform: rotate(180deg); }

  /* ── EXPAND ── */
  .card-expand { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); animation: fadeIn 0.2s ease; }
  .course-card.open .card-expand { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  .tableside-line { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-style: italic; font-weight: 300; color: var(--gold2); line-height: 1.5; padding: 14px 0 12px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }

  .detail-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold-dim); margin-bottom: 6px; }

  .ingredient-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
  .tag { font-size: 13px; padding: 3px 10px; border-radius: 6px; background: var(--bg3); color: var(--muted); border: 1px solid var(--border); }

  /* Allergen grid */
  .allergen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 4px; }
  .allergen-item { padding: 7px 10px; border-radius: 8px; font-size: 13px; }
  .allergen-item.safe { background: var(--green-dim); border: 1px solid rgba(90,154,106,0.2); }
  .allergen-item.contains { background: var(--red-dim); border: 1px solid rgba(201,74,74,0.2); }
  .allergen-item.modifiable { background: var(--yellow-dim); border: 1px solid rgba(201,160,32,0.2); }
  .allergen-item.check { background: var(--yellow-dim); border: 1px solid rgba(201,160,32,0.2); }
  .allergen-name { font-weight: 500; margin-bottom: 1px; }
  .allergen-item.safe .allergen-name { color: var(--green); }
  .allergen-item.contains .allergen-name { color: var(--red); }
  .allergen-item.modifiable .allergen-name, .allergen-item.check .allergen-name { color: var(--yellow); }
  .allergen-note { font-size: 12px; color: var(--muted); line-height: 1.3; }

  /* Expand sections */
  .expand-section { margin-top: 0; }
  .expand-section-title { font-size: 13px; color: var(--gold-dim); letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; padding: 7px 0; border-top: 1px solid var(--border); display: flex; justify-content: space-between; margin-top: 10px; }
  .expand-section-body { font-size: 15px; color: var(--muted); line-height: 1.6; padding: 8px 0 4px; }
  .expand-section-body.collapsed { display: none; }

  .key-term { margin-bottom: 10px; }
  .key-term-name { color: var(--cream); font-weight: 500; font-size: 15px; margin-bottom: 2px; }

  .sourcing-item { margin-bottom: 10px; }
  .sourcing-name { color: var(--cream); font-weight: 500; font-size: 15px; margin-bottom: 2px; }

  .chef-note { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .chef-note-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold-dim); margin-bottom: 5px; }

  /* ── PAIRING CARD ── */
  .pairing-card { background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px; overflow: hidden; margin-top: 8px; }
  .pairing-top { padding: 14px 16px 12px; border-bottom: 1px solid var(--border); }
  .pairing-top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
  .pairing-wine-name { font-family: 'Cormorant Garamond', serif; font-size: 19px; color: var(--cream); line-height: 1.2; margin-bottom: 4px; }
  .pairing-producer { font-family: 'Cormorant Garamond', serif; font-size: 15px; font-style: italic; color: var(--gold2); letter-spacing: 0.04em; }
  .bin-link { display: flex; align-items: center; gap: 5px; text-decoration: none; flex-shrink: 0; margin-top: 2px; }
  .bin-link-nodest { display: flex; align-items: center; gap: 5px; flex-shrink: 0; margin-top: 2px; }
  .bin-number { font-family: 'Cormorant Garamond', serif; font-size: 24px; color: var(--gold); line-height: 1; }
  .bin-arrow { font-size: 14px; color: var(--gold-dim); }
  .bin-exclusive { font-size: 11px; color: var(--gold-dim); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; text-align: right; }
  .pairing-detail-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .pairing-detail-label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-dim); margin-bottom: 2px; }
  .pairing-detail-value { font-size: 13px; color: var(--cream); line-height: 1.3; }
  .pairing-bottom { padding: 12px 16px 14px; }
  .pairing-note { font-size: 14px; color: var(--muted); line-height: 1.65; }
  .pairing-exclusive-note { font-size: 12px; color: var(--gold-dim); font-style: italic; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }

  /* ── AMUSE NOTE ── */
  .amuse-note { font-size: 13px; color: var(--gold-dim); font-style: italic; font-family: 'Cormorant Garamond', serif; padding: 10px 0 2px; }
</style>
</head>
<body>

<div class="site-header">
  <div class="header-eyebrow">Staff Reference</div>
  <div class="header-theme" id="header-theme">Tasting Menu</div>
  <div class="header-title">Tasting Menu</div>
  <div class="header-meta" id="header-meta">Loading…</div>
  <div class="header-pricing" id="header-pricing" style="display:none;">
    <span>$85 / person</span> · <span>+$55 wine pairing</span>
  </div>
  <div class="header-nav">
    <a href="food.html">← Kitchen</a>
    <a href="index.html">Home</a>
  </div>
</div>

<div class="intro-block" id="intro-block" style="display:none;"></div>

<div class="controls" id="controls">
  <div class="course-rail" id="course-rail"></div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input id="search" type="text" placeholder="Search courses…" oninput="handleSearch()" autocomplete="off">
    <button class="expand-filters-btn" onclick="expandFilters()">Courses ↑</button>
  </div>
</div>

<div class="panel-stack">
  <div class="panel" id="verdict-panel">
    <div class="panel-head" onclick="togglePanel('verdict-panel')">
      <div>
        <div class="panel-title">Allergen Check</div>
        <div class="panel-sub" id="verdict-sub">Loading…</div>
      </div>
      <div class="panel-arrow" id="arr-verdict-panel">▸</div>
    </div>
    <div class="panel-body">
      <div class="verdict-grid" id="verdict-grid"></div>
      <div class="verdict-hint">This menu is served as a set sequence, so a verdict applies to the whole table. Tap any allergen to mark the courses it affects.</div>
    </div>
  </div>

  <div class="panel" id="flight-panel">
    <div class="panel-head" onclick="togglePanel('flight-panel')">
      <div>
        <div class="panel-title">Wine Flight</div>
        <div class="panel-sub" id="flight-sub">Loading…</div>
      </div>
      <div class="panel-arrow" id="arr-flight-panel">▸</div>
    </div>
    <div class="panel-body">
      <div id="flight-list"></div>
    </div>
  </div>
</div>

<div id="focus-wrap"></div>

<div class="result-count" id="result-count"></div>
<div class="course-list" id="course-list">
  <div class="empty">Loading…</div>
</div>

<script>
let COURSES = [];
let openId = null;
let focusAllergen = null;
let searchQuery = '';
let manualExpand = false;
let scrollAfterExpand = 0;

const ALLERGEN_LABELS = {
  shellfish: '🦐 Shellfish', dairy: '🥛 Dairy', nuts: '🌰 Nuts',
  peanuts: '🥜 Peanuts', gluten: '🌾 Gluten', eggs: '🥚 Eggs',
  soy: '🫘 Soy', vegetarian: '🌿 Vegetarian', vegan: '🌱 Vegan'
};

const ALLERGEN_KEYS = ['shellfish','dairy','nuts','gluten','eggs','soy','peanuts','vegetarian','vegan'];

// Dietary keys read as a positive claim ("this menu is vegetarian"), the rest
// read as an absence ("this menu is nut free"). Same data, different sentence.
const DIETARY_KEYS = ['vegetarian','vegan'];

// "Nut free", not "nuts free". The free-form wants the singular.
const FREE_LABELS = {
  shellfish: 'Shellfish', dairy: 'Dairy', nuts: 'Nut', peanuts: 'Peanut',
  gluten: 'Gluten', eggs: 'Egg', soy: 'Soy'
};

function statusClass(status) {
  const map = { safe: 'safe', yes: 'safe', modifiable: 'check', check: 'check', contains: 'contains', no: 'contains' };
  return map[status] || 'contains';
}

let _scrollSettleAbort = null;
function scrollToEl(el) {
  if (!el) return;
  if (_scrollSettleAbort) _scrollSettleAbort();   // cancel any run still in flight

  const controls = document.querySelector('.controls');
  const GAP = 48;
  const barH = () => (controls ? controls.offsetHeight : 0);
  const INPUT = ['wheel', 'touchstart', 'pointerdown', 'mousedown', 'keydown'];

  let cancelled = false, timer = null, intended = null;

  const stop = () => {
    cancelled = true;
    if (timer) { clearTimeout(timer); timer = null; }
    INPUT.forEach(ev => window.removeEventListener(ev, stop));
    if (_scrollSettleAbort === stop) _scrollSettleAbort = null;
  };
  INPUT.forEach(ev => window.addEventListener(ev, stop, { passive: true }));
  _scrollSettleAbort = stop;

  const place = () => {
    intended = el.getBoundingClientRect().top + window.scrollY - (barH() + GAP);
    intended = Math.max(0, intended);
    window.scrollTo({ top: intended, behavior: 'smooth' });
  };

  // Wait until scrolling has actually stopped before touching anything. Polling
  // for a stable position works whether the scroll came from us, a wheel, a
  // dragged scrollbar or a finger, which matters because a dragged scrollbar
  // fires no pointer events on the page at all.
  const whenIdle = (cb, checks, last) => {
    if (cancelled) return;
    const y = window.scrollY;
    if (y === last) { checks++; } else { checks = 0; }
    if (checks >= 2) return cb();
    timer = setTimeout(() => whenIdle(cb, checks, y), 60);
  };

  // One correction, only if the page is still roughly where we put it. If the
  // guest has scrolled somewhere else, leave them alone.
  const correctOnce = () => {
    if (cancelled) return stop();
    if (intended !== null && Math.abs(window.scrollY - intended) > 200) return stop();
    const off = (el.getBoundingClientRect().top - barH()) - GAP;
    if (Math.abs(off) > 4) window.scrollBy({ top: off, behavior: 'auto' });
    stop();
  };

  const run = () => {
    if (cancelled) return;
    place();
    timer = setTimeout(() => whenIdle(correctOnce, 0, null), 200);
  };

  if (document.fonts && document.fonts.status !== 'loaded' && document.fonts.ready) {
    document.fonts.ready.then(run).catch(run);
  } else { run(); }
}

function applyScrollMargins() {
  const controls = document.getElementById('controls');
  const h = controls ? controls.offsetHeight : 0;
  const margin = (h + 48) + 'px';
  document.querySelectorAll('[id^="card-"]').forEach(el => el.style.scrollMarginTop = margin);
}

// Controls collapse
window.addEventListener('scroll', () => {
  const controls = document.getElementById('controls');
  const y = window.scrollY;
  if (y > 60) {
    if (manualExpand) {
      if (y > scrollAfterExpand + 80) { controls.classList.add('collapsed'); manualExpand = false; }
    } else {
      controls.classList.add('collapsed');
    }
  } else {
    controls.classList.remove('collapsed');
    manualExpand = false;
  }
});

function expandFilters() {
  const controls = document.getElementById('controls');
  controls.classList.remove('collapsed');
  manualExpand = true;
  scrollAfterExpand = window.scrollY;
}

// ── MENU-LEVEL ALLERGEN VERDICT ──
// A tasting menu is a fixed sequence, so the useful question is not "which
// courses pass" but "can this table be seated on this menu at all". Verdict is
// the worst status across every course, plus the courses responsible for it.
function menuVerdict(key) {
  const blockers = [], watch = [];
  COURSES.forEach(c => {
    const cls = statusClass(c.allergens?.[key]?.status);
    if (cls === 'contains') blockers.push(c);
    else if (cls === 'check') watch.push(c);
  });
  const level = blockers.length ? 'blocked' : watch.length ? 'check' : 'clear';
  return { level, blockers, watch };
}

function courseNums(list) {
  return list.map(c => String(c.course).padStart(2,'0')).join(', ');
}

function verdictLine(key, v) {
  const dietary = DIETARY_KEYS.includes(key);
  if (v.level === 'clear') return dietary ? 'Whole menu as written' : 'No courses affected';
  if (v.level === 'check') return `Confirm ${v.watch.length === 1 ? 'course' : 'courses'} ${courseNums(v.watch)}`;
  const tail = v.watch.length ? ` · confirm ${courseNums(v.watch)}` : '';
  return `${v.blockers.length === 1 ? 'Course' : 'Courses'} ${courseNums(v.blockers)}${tail}`;
}

function verdictHeadline(key, v) {
  const plain = ALLERGEN_LABELS[key].replace(/^\S+\s/, '');
  const free = FREE_LABELS[key] || plain;
  const dietary = DIETARY_KEYS.includes(key);
  if (v.level === 'clear') return dietary ? `${plain} throughout` : `${free} free throughout`;
  if (v.level === 'check') return dietary ? `${plain}, kitchen check` : `${free} free, kitchen check`;
  return dietary ? `Not ${plain.toLowerCase()}` : `Contains ${plain.toLowerCase()}`;
}

function renderVerdicts() {
  const grid = document.getElementById('verdict-grid');
  const sub = document.getElementById('verdict-sub');
  if (!COURSES.length) return;

  let blocked = 0, checks = 0;
  const html = ALLERGEN_KEYS.map(key => {
    const v = menuVerdict(key);
    if (v.level === 'blocked') blocked++;
    else if (v.level === 'check') checks++;
    const focused = focusAllergen === key ? ' focused' : '';
    return `<div class="verdict-item ${v.level}${focused}" onclick="setFocus('${key}')">
      <div class="verdict-name">${verdictHeadline(key, v)}</div>
      <div class="verdict-line">${verdictLine(key, v)}</div>
    </div>`;
  }).join('');
  grid.innerHTML = html;

  const parts = [];
  if (blocked) parts.push(`${blocked} cannot be served as written`);
  if (checks) parts.push(`${checks} need${checks === 1 ? 's' : ''} a kitchen check`);
  sub.textContent = parts.length ? parts.join(', ') : 'Every allergen clear on this menu';
}

// ── FOCUS MODE ──
// Tapping an allergen marks the courses it affects rather than hiding anything.
// Hiding courses on a fixed menu implies a guest could order around the gap.
function setFocus(key) {
  focusAllergen = focusAllergen === key ? null : key;
  renderVerdicts();
  renderFocusBar();
  renderRail();
  render();
}

function clearFocus() {
  focusAllergen = null;
  renderVerdicts();
  renderFocusBar();
  renderRail();
  render();
}

function renderFocusBar() {
  const wrap = document.getElementById('focus-wrap');
  if (!focusAllergen) { wrap.innerHTML = ''; return; }
  const v = menuVerdict(focusAllergen);
  wrap.innerHTML = `<div class="focus-bar">
    <span><strong>${ALLERGEN_LABELS[focusAllergen]}</strong> · ${verdictLine(focusAllergen, v)}</span>
    <button onclick="clearFocus()">Clear</button>
  </div>`;
}

function courseVisible(course) {
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    const haystack = [course.name, course.section, course.description].join(' ').toLowerCase();
    if (!haystack.includes(q)) return false;
  }
  return true;
}

// ── COURSE RAIL ──
function renderRail() {
  const rail = document.getElementById('course-rail');
  if (!COURSES.length) { rail.innerHTML = ''; return; }
  rail.innerHTML = COURSES.map(c => {
    const active = openId === c.id ? ' active' : '';
    let flag = '';
    if (focusAllergen) {
      const cls = statusClass(c.allergens?.[focusAllergen]?.status);
      if (cls !== 'safe') flag = ` flagged ${cls}`;
    }
    return `<button class="rail-btn${active}${flag}" onclick="jumpToCourse('${c.id}')">
      <span class="rail-num">${String(c.course).padStart(2,'0')}</span>
      <span class="rail-label">${c.section}</span>
    </button>`;
  }).join('');
}

function jumpToCourse(id) {
  if (openId !== id) openId = id;
  render();
  renderRail();
  requestAnimationFrame(() => {
    applyScrollMargins();
    setTimeout(() => scrollToEl(document.getElementById('card-' + id)), 50);
  });
}

// ── WINE FLIGHT ──
function renderFlight(data) {
  const list = document.getElementById('flight-list');
  const sub = document.getElementById('flight-sub');
  const poured = COURSES.filter(c => c.pairing);
  const exclusive = poured.filter(c => !c.pairing.in_list).length;

  const bits = [`${poured.length} pours · $${data.pairing_price}`];
  if (exclusive) bits.push(`${exclusive} not on the list`);
  sub.textContent = bits.join(' · ');

  const hashPages = ['afters', 'whisky'];
  list.innerHTML = COURSES.map(c => {
    const p = c.pairing;
    const num = `<div class="flight-num">${String(c.course).padStart(2,'0')}</div>`;
    if (!p) {
      return `<div class="flight-item">${num}
        <div class="flight-main">
          <div class="flight-producer" style="color:var(--gold-dim);">No pour</div>
          <div class="flight-meta">${c.name}</div>
        </div>
      </div>`;
    }
    const link = p.in_list
      ? `<a class="flight-link" href="${hashPages.includes(p.file) ? `${p.file}.html#card-${p.wine_id}` : `${p.file}.html?open=${p.wine_id}`}" onclick="event.stopPropagation()">
           <span class="flight-bin">#${p.bin}</span><span class="flight-arrow">→</span>
         </a>`
      : `<div class="flight-none">—</div>`;
    return `<div class="flight-item">${num}
      <div class="flight-main">
        <div class="flight-producer">${p.producer}</div>
        <div class="flight-wine">${p.name}</div>
        <div class="flight-meta">${[p.grapes, p.region, p.vintage].filter(Boolean).join(' · ')}</div>
        ${!p.in_list ? '<div class="flight-tag">Tasting menu only</div>' : ''}
      </div>
      ${link}
    </div>`;
  }).join('');
}

function togglePanel(id) {
  const panel = document.getElementById(id);
  const arr = document.getElementById('arr-' + id);
  const isOpen = panel.classList.contains('open');
  panel.classList.toggle('open', !isOpen);
  if (arr) arr.textContent = isOpen ? '▸' : '▾';
}

function handleSearch() {
  searchQuery = document.getElementById('search').value.trim();
  render();
}

function render() {
  const list = document.getElementById('course-list');
  const visible = COURSES.filter(courseVisible);
  document.getElementById('result-count').textContent =
    visible.length < COURSES.length ? `${visible.length} of ${COURSES.length} courses shown` : '';

  if (!COURSES.length) return;

  list.innerHTML = COURSES.map(course => {
    const isOpen = openId === course.id;
    const isVisible = courseVisible(course);
    const veg = course.allergens?.vegetarian?.status === 'yes';
    const vegan = course.allergens?.vegan?.status === 'yes';

    let focusBadge = '', focusCls = '';
    if (focusAllergen) {
      const a = course.allergens?.[focusAllergen];
      const cls = statusClass(a?.status);
      const label = ALLERGEN_LABELS[focusAllergen];
      const dietary = DIETARY_KEYS.includes(focusAllergen);
      const text = cls === 'safe' ? (dietary ? label : `${label} free`)
                 : cls === 'check' ? `${label} · confirm`
                 : `${label} · contains`;
      focusBadge = `<span class="focus-badge ${cls}">${text}</span>`;
      focusCls = cls === 'safe' ? ' dimmed' : cls === 'contains' ? ' flagged' : '';
    }

    return `
    <div class="course-card${isOpen ? ' open' : ''}${!isVisible ? ' filtered-out' : ''}${focusCls}"
         id="card-${course.id}" onclick="toggleCard('${course.id}')">
      <div class="card-top">
        <div class="course-num">${String(course.course).padStart(2,'0')}</div>
        <div class="card-main">
          <div class="course-section-label">${course.section}</div>
          <div class="course-name">${course.name}</div>
          <div class="course-desc">${course.description}</div>
          <div class="card-badges">
            ${focusBadge}
            ${vegan ? '<span class="veg-badge">🌱 Vegan</span>' : veg ? '<span class="veg-badge">🌿 Vegetarian</span>' : ''}
            ${!course.pairing ? '<span class="no-pairing-badge">Amuse · no pairing</span>' : ''}
          </div>
        </div>
        <div class="chevron">▾</div>
      </div>
      ${isOpen ? `<div class="card-expand">${buildExpand(course)}</div>` : ''}
    </div>`;
  }).join('');

  applyScrollMargins();
}

function buildAllergenGrid(course) {
  const items = [
    { key: 'shellfish', label: '🦐 Shellfish' },
    { key: 'dairy',     label: '🥛 Dairy' },
    { key: 'nuts',      label: '🌰 Nuts' },
    { key: 'gluten',    label: '🌾 Gluten' },
    { key: 'eggs',      label: '🥚 Eggs' },
    { key: 'soy',       label: '🫘 Soy' },
    { key: 'peanuts',   label: '🥜 Peanuts' },
    { key: 'vegetarian',label: '🌿 Vegetarian' },
    { key: 'vegan',     label: '🌱 Vegan' },
  ];
  return items.map(({ key, label }) => {
    const a = course.allergens?.[key];
    if (!a) return '';
    const statusMap = { safe: 'safe', yes: 'safe', modifiable: 'modifiable', check: 'check', contains: 'contains', no: 'contains' };
    const cls = statusMap[a.status] || 'contains';
    const display = (a.status === 'safe' || a.status === 'yes') ? label + '-free' : label;
    return `<div class="allergen-item ${cls}">
      <div class="allergen-name">${display}</div>
      <div class="allergen-note">${a.note}</div>
    </div>`;
  }).join('');
}

function buildPairingCard(pairing) {
  if (!pairing) return `<div class="amuse-note">No wine pairing for this course.</div>`;

  const hashPages = ['afters', 'whisky'];
  const binEl = pairing.in_list
    ? (() => {
        const href = hashPages.includes(pairing.file)
          ? `${pairing.file}.html#card-${pairing.wine_id}`
          : `${pairing.file}.html?open=${pairing.wine_id}`;
        return `<a class="bin-link" href="${href}" onclick="event.stopPropagation()">
          <div class="bin-number">#${pairing.bin}</div>
          <div class="bin-arrow">→</div>
         </a>`;
      })()
    : `<div class="bin-link-nodest">
        <div class="bin-number" style="color:var(--gold-dim);">—</div>
       </div>`;

  return `<div class="pairing-card">
    <div class="pairing-top">
      <div class="pairing-top-row">
        <div>
          <div class="pairing-wine-name">${pairing.name}</div>
          <div class="pairing-producer">${pairing.producer}</div>
        </div>
        ${binEl}
      </div>
      <div class="pairing-detail-row">
        <div>
          <div class="pairing-detail-label">Grapes</div>
          <div class="pairing-detail-value">${pairing.grapes}</div>
        </div>
        <div>
          <div class="pairing-detail-label">Region</div>
          <div class="pairing-detail-value">${pairing.region}</div>
        </div>
        <div>
          <div class="pairing-detail-label">Vintage</div>
          <div class="pairing-detail-value">${pairing.vintage}</div>
        </div>
      </div>
    </div>
    <div class="pairing-bottom">
      <div class="pairing-note">${pairing.note}</div>
      ${!pairing.in_list ? `<div class="pairing-exclusive-note">This wine is exclusive to the tasting menu pairing and is not on the regular wine list.</div>` : ''}
    </div>
  </div>`;
}

function buildExpand(course) {
  const ingredients = course.ingredients.map(i => `<span class="tag">${i}</span>`).join('');

  const allergenGrid = buildAllergenGrid(course);

  const keyTermsHtml = course.key_terms?.length
    ? course.key_terms.map(t => `<div class="key-term"><div class="key-term-name">${t.term}</div>${t.definition}</div>`).join('')
    : '';

  const sourcingHtml = course.sourcing?.length
    ? course.sourcing.map(s => `<div class="sourcing-item"><div class="sourcing-name">${s.name}</div>${s.description}</div>`).join('')
    : '';

  const chefHtml = course.chef_notes
    ? `<div class="chef-note"><div class="chef-note-label">From the kitchen</div>${course.chef_notes}</div>`
    : '';

  // Optional. Render only when the month's menu supplies them, so neither field
  // is required to ship a new menu.
  const storyHtml = course.story ? `<div>${course.story}</div>` : '';
  const triviaHtml = Array.isArray(course.trivia) && course.trivia.length
    ? course.trivia.map(t => `<div class="key-term">${t}</div>`).join('')
    : '';

  const pairingCard = buildPairingCard(course.pairing);

  return `
    <div class="tableside-line">${course.tableside}</div>

    <div class="detail-label">Ingredients</div>
    <div class="ingredient-tags">${ingredients}</div>

    <div class="detail-label">Allergens</div>
    <div class="allergen-grid">${allergenGrid}</div>

    ${keyTermsHtml ? `
    <div class="expand-section">
      <div class="expand-section-title" onclick="toggleSec(event,'${course.id}-terms')">Key Terms <span id="arr-${course.id}-terms">▾</span></div>
      <div class="expand-section-body" id="sec-${course.id}-terms">${keyTermsHtml}</div>
    </div>` : ''}

    ${sourcingHtml ? `
    <div class="expand-section">
      <div class="expand-section-title" onclick="toggleSec(event,'${course.id}-sourcing')">Sourcing &amp; Provenance <span id="arr-${course.id}-sourcing">▾</span></div>
      <div class="expand-section-body" id="sec-${course.id}-sourcing">${sourcingHtml}</div>
    </div>` : ''}

    ${chefHtml ? `
    <div class="expand-section">
      <div class="expand-section-title" onclick="toggleSec(event,'${course.id}-chef')">Chef &amp; Service Notes <span id="arr-${course.id}-chef">▾</span></div>
      <div class="expand-section-body" id="sec-${course.id}-chef">${chefHtml}</div>
    </div>` : ''}

    ${storyHtml ? `
    <div class="expand-section">
      <div class="expand-section-title" onclick="toggleSec(event,'${course.id}-story')">Story <span id="arr-${course.id}-story">▾</span></div>
      <div class="expand-section-body" id="sec-${course.id}-story">${storyHtml}</div>
    </div>` : ''}

    ${triviaHtml ? `
    <div class="expand-section">
      <div class="expand-section-title" onclick="toggleSec(event,'${course.id}-trivia')">Trivia <span id="arr-${course.id}-trivia">▾</span></div>
      <div class="expand-section-body" id="sec-${course.id}-trivia">${triviaHtml}</div>
    </div>` : ''}

    <div class="expand-section">
      <div class="expand-section-title" onclick="toggleSec(event,'${course.id}-pairing')">Wine Pairing <span id="arr-${course.id}-pairing">▾</span></div>
      <div class="expand-section-body" id="sec-${course.id}-pairing">${pairingCard}</div>
    </div>
  `;
}

function toggleCard(id) {
  openId = openId === id ? null : id;
  render();
  renderRail();
  requestAnimationFrame(() => {
    applyScrollMargins();
    if (openId) {
      setTimeout(() => scrollToEl(document.getElementById('card-' + id)), 50);
    }
  });
}

function toggleSec(e, secId) {
  e.stopPropagation();
  const sec = document.getElementById('sec-' + secId);
  const arr = document.getElementById('arr-' + secId);
  if (!sec) return;
  const isOpen = !sec.classList.contains('collapsed');
  sec.classList.toggle('collapsed', isOpen);
  if (arr) arr.textContent = isOpen ? '▸' : '▾';
}

fetch('tasting.json')
  .then(r => r.json())
  .then(data => {
    COURSES = data.courses;

    document.getElementById('header-theme').textContent = data.theme;
    document.getElementById('header-meta').textContent = `${data.date} · ${data.courses.length} courses`;
    const pricing = document.getElementById('header-pricing');
    pricing.innerHTML = `<span>$${data.price} / person</span> · <span style="color:var(--gold-dim);">+$${data.pairing_price} wine pairing</span>`;
    pricing.style.display = 'inline-flex';

    const intro = document.getElementById('intro-block');
    if (data.intro) { intro.textContent = data.intro; intro.style.display = 'block'; }

    renderRail();
    renderVerdicts();
    renderFlight(data);
    render();

    requestAnimationFrame(() => {
      applyScrollMargins();
      const params = new URLSearchParams(window.location.search);

      if (params.get('flight') === 'true') togglePanel('flight-panel');

      const allergenParam = params.get('allergen');
      if (allergenParam && ALLERGEN_KEYS.includes(allergenParam)) {
        focusAllergen = allergenParam;
        if (!document.getElementById('verdict-panel').classList.contains('open')) togglePanel('verdict-panel');
        renderVerdicts();
        renderFocusBar();
        renderRail();
        render();
      }

      const openParam = params.get('open');
      if (openParam) {
        openId = openParam;
        render();
        requestAnimationFrame(() => {
          applyScrollMargins();
          setTimeout(() => scrollToEl(document.getElementById('card-' + openParam)), 100);
        });
      }
    });
  })
  .catch(err => {
    console.error('Could not load tasting.json:', err);
    document.getElementById('course-list').innerHTML = '<div class="empty">Could not load tasting.json.</div>';
    document.getElementById('header-meta').textContent = 'Error loading data';
  });
</script>
